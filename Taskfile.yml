version: '3'

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Print a list of available tasks
    cmds:
      - task --list

  up:
    desc: Start the stack in detached mode
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down

  restart:
    desc: Restart the stack
    cmds:
      - task: down
      - task: up

  logs:
    desc: Tail logs for the entire stack
    cmds:
      - docker compose logs -f

  up:ca-trust:
    desc: Start the stack with the host CA trust bundle mounted in Semaphore
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.ca-trust.yml up -d --build

  down:ca-trust:
    desc: Stop and remove the CA-trust-enabled stack
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.ca-trust.yml down

  restart:ca-trust:
    desc: Restart the stack with the host CA trust bundle mounted in Semaphore
    cmds:
      - task: down:ca-trust
      - task: up:ca-trust

  logs:ca-trust:
    desc: Tail logs for the CA-trust-enabled stack
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.ca-trust.yml logs -f

  build:semaphore:
    desc: Pull the base image and rebuild Semaphore host-management dependencies
    cmds:
      - docker compose build --pull semaphore

  semaphore:prereqs:
    desc: Verify WinRM, NTLM and Linux password-auth dependencies
    cmds:
      - docker exec semaphore sh -ec 'command -v sshpass >/dev/null && python3 -c "import winrm, requests_ntlm"'
      - echo "Semaphore prerequisites are available."

  semaphore:genkey:
    desc: Generate a value for SEMAPHORE_ACCESS_KEY_ENCRYPTION (store it in .env AND a password manager)
    cmds:
      - openssl rand -base64 32
      - echo "Put this in .env as SEMAPHORE_ACCESS_KEY_ENCRYPTION and back it up. Losing it makes every stored Semaphore credential unrecoverable."

  # Deliberately does NOT compare against /etc/semaphore/config.json. `semaphore
  # setup` writes a freshly generated key into that file on every start, and the
  # env var overrides it at runtime — so the two legitimately differ and a
  # comparison reports a failure that is not one. See
  # docs/semaphore-access-key-encryption.md.
  semaphore:encryption-check:
    desc: Verify SEMAPHORE_ACCESS_KEY_ENCRYPTION is set in the container and is a valid 32-byte key
    cmds:
      - >-
        docker exec semaphore sh -ec 'test -n "$SEMAPHORE_ACCESS_KEY_ENCRYPTION" || { echo "FAIL: SEMAPHORE_ACCESS_KEY_ENCRYPTION is not set in the container; stored secrets will be orphaned on the next container recreate"; exit 1; }; n=$(printf %s "$SEMAPHORE_ACCESS_KEY_ENCRYPTION" | base64 -d 2>/dev/null | wc -c); test "$n" -eq 32 || { echo "FAIL: key decodes to $n bytes; AES requires 32. Regenerate with: task semaphore:genkey"; exit 1; }'
      - echo "OK - access-key encryption is pinned to a 32-byte key from .env."

  postgres:backup:15:
    desc: Export PostgreSQL 15 databases from the retained legacy volumes
    cmds:
      - bash scripts/postgres-15-to-18.sh backup

  postgres:restore:18:
    desc: Initialize PostgreSQL 18 volumes and restore the PostgreSQL 15 exports
    cmds:
      - bash scripts/postgres-15-to-18.sh restore

  postgres:verify:18:
    desc: Verify PostgreSQL 18 versions and restored table counts
    cmds:
      - bash scripts/postgres-15-to-18.sh verify

  vault-init:
    desc: Initialize HashiCorp Vault
    cmds:
      - docker exec vault vault operator init

  vault-unseal:
    desc: Unseal Vault (requires keys from init)
    cmds:
      - docker exec vault vault operator unseal
