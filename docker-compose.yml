version: '3.8'

services:
  # --- SECRET MANAGEMENT ---
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    networks:
      - devops_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- KNOWLEDGE BASE ---
  wikijs:
    image: requarks/wiki:2
    container_name: wikijs
    environment:
      - DB_TYPE=postgres
      - DB_HOST=wikijs-db
      - DB_PORT=5432
      - DB_USER=${WIKI_DB_USER}
      - DB_PASS=${WIKI_DB_PASS}
      - DB_NAME=${WIKI_DB_NAME}
    volumes:
      - wikijs_data:/var/wiki/data
    networks:
      - devops_net
    ports:
      - "3001:3000"
    depends_on:
      - wikijs-db

  wikijs-db:
    image: postgres:18-alpine
    container_name: wikijs-db
    environment:
      - POSTGRES_USER=${WIKI_DB_USER}
      - POSTGRES_PASSWORD=${WIKI_DB_PASS}
      - POSTGRES_DB=${WIKI_DB_NAME}
    volumes:
      - wikijs_db_data_pg18:/var/lib/postgresql
    networks:
      - devops_net

  # --- CONTAINER MANAGEMENT ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - devops_net
    depends_on:
      - vault

  # --- REVERSE PROXY ---
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - devops_net
    depends_on:
      - vault

  # --- INFRASTRUCTURE AUTOMATION ---
  semaphore:
    image: ${SEMAPHORE_IMAGE:-devops-server/semaphore:local}
    build:
      context: .
      dockerfile: Dockerfile.semaphore
      args:
        SEMAPHORE_BASE_IMAGE: ${SEMAPHORE_BASE_IMAGE:-semaphoreui/semaphore:latest}
    container_name: semaphore
    ports:
      - "3000:3000"
    environment:
      - SEMAPHORE_DB_USER=${SEMAPHORE_DB_USER}
      - SEMAPHORE_DB_PASS=${SEMAPHORE_DB_PASS}
      - SEMAPHORE_DB_HOST=semaphore-db
      - SEMAPHORE_DB_PORT=5432
      - SEMAPHORE_DB_DIALECT=postgres
      - SEMAPHORE_DB=${SEMAPHORE_DB_NAME}
      - SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASS}
      - SEMAPHORE_ADMIN_NAME=admin
      - SEMAPHORE_ADMIN_EMAIL=admin@example.com
      - SEMAPHORE_ADMIN=admin
      # Encrypts Key Store and Variable Group secrets at rest, and MUST be
      # pinned. /etc/semaphore/config.json lives in the container filesystem
      # rather than a volume, so without this the entrypoint mints a fresh
      # random key on every container recreate while semaphore_db_data_pg18
      # survives holding rows encrypted under the previous one. Every stored
      # credential then becomes permanently undecryptable.
      #
      # `:?` is deliberate: the failure is otherwise silent at start and only
      # surfaces later as an opaque UI error. Refusing to start is better.
      # See docs/semaphore-access-key-encryption.md
      - SEMAPHORE_ACCESS_KEY_ENCRYPTION=${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?not set in .env - generate one with 'task semaphore:genkey', then see docs/semaphore-access-key-encryption.md}
    networks:
      - devops_net
    depends_on:
      - semaphore-db
      - vault

  semaphore-db:
    image: postgres:18-alpine
    container_name: semaphore-db
    environment:
      - POSTGRES_USER=${SEMAPHORE_DB_USER}
      - POSTGRES_PASSWORD=${SEMAPHORE_DB_PASS}
      - POSTGRES_DB=${SEMAPHORE_DB_NAME}
    volumes:
      - semaphore_db_data_pg18:/var/lib/postgresql
    networks:
      - devops_net

networks:
  devops_net:
    driver: bridge

volumes:
  vault_data:
  portainer_data:
  npm_data:
  npm_letsencrypt:
  semaphore_db_data_pg18:
  wikijs_data:
  wikijs_db_data_pg18:
